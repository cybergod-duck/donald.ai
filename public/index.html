<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DONALD.AI | Voss Neural Research</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #000;
      color: #0f0;
      overflow: hidden;
      height: 100vh;
    }

    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.15;
    }

    .page-shell {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
    }

    .chrome-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      margin-bottom: 20px;
    }

    .chrome-title {
      color: #0ff;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #0ff;
    }

    .chrome-status {
      color: #0f0;
      font-size: 12px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #0f0;
      border-radius: 50%;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .layout-row {
      display: flex;
      flex: 1;
      gap: 20px;
      overflow: hidden;
    }

    .chrome-frame {
      flex: 1;
      position: relative;
      border: 2px solid #0ff;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #frame {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #trump-video {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      display: block;
    }

    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px;
      text-align: center;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
    }

    .video-overlay h1 {
      font-size: 48px;
      color: #0ff;
      text-shadow: 0 0 20px #0ff;
      margin-bottom: 10px;
      letter-spacing: 8px;
    }

    .video-overlay .colon {
      display: block;
      font-size: 24px;
      margin: 5px 0;
    }

    .video-overlay p {
      font-size: 16px;
      color: #0f0;
      margin-top: 10px;
    }

    .terminal-input {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      background: rgba(0, 20, 20, 0.8);
      border-top: 1px solid #0ff;
      margin-top: 20px;
    }

    .terminal-prompt {
      color: #0f0;
      margin-right: 10px;
      font-size: 18px;
    }

    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      color: #0ff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      outline: none;
    }

    #cmd::placeholder {
      color: rgba(0, 255, 255, 0.5);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 3;
    }

    .controls button,
    #music-toggle {
      width: 50px;
      height: 50px;
      border: 2px solid #0ff;
      border-radius: 8px;
      background: rgba(0, 50, 50, 0.5);
      cursor: pointer;
      transition: all 0.3s;
    }

    .controls button:hover,
    #music-toggle:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 15px #0ff;
    }

    .controls button img,
    #music-toggle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .layout-sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .side-card {
      background: rgba(0, 20, 20, 0.8);
      border: 1px solid #0ff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
    }

    .side-card h2 {
      color: #0ff;
      font-size: 16px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .side-card ul {
      list-style: none;
    }

    .side-card li {
      color: #0f0;
      font-size: 13px;
      margin-bottom: 8px;
      padding-left: 15px;
      position: relative;
    }

    .side-card li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #0ff;
    }

    .transcript-card {
      flex: 1;
    }

    .transcript-body {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 5px;
      padding: 15px;
      height: 200px;
      overflow-y: auto;
      font-size: 12px;
      color: #0f0;
    }

    .transcript-placeholder {
      color: rgba(0, 255, 0, 0.5);
      font-style: italic;
    }

    .site-footer {
      text-align: center;
      padding: 15px;
      color: #0ff;
      font-size: 12px;
      margin-top: 20px;
    }

    .brand-white {
      color: #fff;
    }

    #music-toggle {
      position: fixed;
      bottom: 20px;
      left: 20px;
      border-radius: 50%;
      background: rgba(0, 50, 50, 0.8);
      z-index: 1000;
    }
  </style>
</head>

<body>
  <canvas id="matrix-canvas"></canvas>
  <button id="music-toggle" aria-label="Toggle background music"><img id="music-icon" src="/assets/images/note-on.png"
      alt="Music On"></button>
  <div class="page-shell">
    <header class="chrome-header">
      <div class="chrome-title">DONALD.AI // PRESIDENTIAL SPEECH ENGINE</div>
      <div class="chrome-status"><span class="status-dot"></span><span>LIVE</span></div>
    </header>
    <div class="layout-row">
      <div class="chrome-frame">
        <div id="frame">
          <video id="trump-video" autoplay loop muted playsinline>
            <source src="/assets/media/video/special/idle.webm" type="video/webm">
          </video>
          <div class="video-overlay">
            <h1>DONALD.AI</h1>
            <span class="colon">:</span>
            <p>Type a topic. Hear the speech.</p>
          </div>
          <div class="controls">
            <button id="pause-btn"><img src="/assets/images/pause.png" alt="Pause"></button>
            <button id="mute-btn"><img src="/assets/images/mute.png" alt="Mute"></button>
            <button id="lightning-btn"><img src="/assets/images/create.png" alt="Flash"></button>
            <button id="dice-btn"><img src="/assets/images/random.png" alt="Random"></button>
            <button id="stop-btn"><img src="/assets/images/stop.png" alt="Stop"></button>
          </div>
        </div>
      </div>
      <aside class="layout-sidebar">
        <section class="side-card">
          <h2>QUICK GUIDE</h2>
          <ul>
            <li>Type any topic.</li>
            <li>Press Enter or use the dice.</li>
            <li>Let him talk.</li>
          </ul>
        </section>
        <section class="side-card transcript-card">
          <h2>Transcript</h2>
          <div id="transcript" class="transcript-body">
            <span class="transcript-placeholder">Your speech text will appear here.</span>
          </div>
        </section>
      </aside>
    </div>
    <div class="terminal-input">
      <span class="terminal-prompt">></span>
      <input type="text" id="cmd" placeholder="give a speech on..." aria-label="Enter speech prompt">
    </div>
    <footer class="site-footer">
      <span>CERTIFIED BY</span> <span class="brand-white">SIMPLE AS THAT</span>
    </footer>
  </div>
  <audio id="drone-audio" loop>
    <source src="/assets/media/audio/Drone.mp3" type="audio/mpeg">
  </audio>
  <script src="/js/app.js"></script>
</body>

</html>

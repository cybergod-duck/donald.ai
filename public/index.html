<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DONALD.AI</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Minimal reset to ensure nothing weird happens before CSS loads */
    body {
      margin: 0;
      background: #000;
      color: #0f0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <div id="app-container">
    <!-- Main Video Feed -->
    <div id="video-frame">
      <video id="trump-video" autoplay loop muted playsinline>
        <source src="/assets/media/video/special/idle.webm" type="video/webm">
      </video>

      <!-- Minimal Overlay for Status -->
      <div id="status-overlay">IDLE</div>

      <!-- Loading Bar Overlay -->
      <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <div class="loading-text">NEURAL NET PROCESSING...</div>
      </div>
    </div>

    <!-- Controls Row -->
    <div id="controls">
      <button id="pause-btn" class="control-btn"><img src="/assets/images/pause.png" alt="Pause"></button>
      <button id="mute-btn" class="control-btn"><img src="/assets/images/mute.png" alt="Mute"></button>
      <button id="lightning-btn" class="control-btn"><img src="/assets/images/create.png" alt="Flash"></button>
      <button id="dice-btn" class="control-btn"><img src="/assets/images/random.png" alt="Random"></button>
      <button id="stop-btn" class="control-btn"><img src="/assets/images/stop.png" alt="Stop"></button>
    </div>

    <!-- Input Area -->
    <div id="input-area">
      <input type="text" id="cmd" placeholder="Type a topic..." autocomplete="off">
    </div>

    <!-- Background Audio (Hidden) -->
    <audio id="ambient-audio" loop>
      <source src="/assets/media/audio/Drone.mp3" type="audio/mpeg">
    </audio>
  </div>

  <!-- Debug Log -->
  <div id="debug-log"></div>

  <script src="/js/app.js"></script>
</body>

</html>
